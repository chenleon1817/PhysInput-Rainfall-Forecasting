name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall core scripts tests
      - run: pytest -q
      - run: python scripts/03_export_model_csv.py --help
      - run: python scripts/05_train_models.py --help
      - run: python scripts/06_evaluate_models.py --help
      - run: python scripts/07_make_paper_figures.py --help
      - run: "! rg -i 'PG-SCA|pg_cnn|FiLM|dual gate|recall gate|rescue|hard max' core scripts configs"
